# ============================================================
# publicar.yml — o "robô" que publica o site no GitHub Pages.
# Toda vez que um commit chega na branch main do GitHub, ele:
#   1. baixa o código;  2. instala as dependências e constrói o site
#   (npm run build);  3. publica a pasta dist/ no GitHub Pages.
# Também dá para rodar à mão pela aba "Actions" do repositório.
# ============================================================
name: Publicar o site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas: ler o código e publicar no Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Se dois envios chegarem juntos, só o mais recente é publicado.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
      - name: Construir o site com o Astro
        uses: withastro/action@v6
        with:
          node-version: 24

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v5
